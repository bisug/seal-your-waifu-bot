[project]
name = "app"
version = "0.1.0"
description = "Telegram Bot"
readme = "README.md"

# 3.14 is currently the safest modern production target.
requires-python = ">=3.14"

dependencies = [
    # API Framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    # HTTP / Networking
    "httpx>=0.28.1",
    "httptools>=0.8.0",
    "dnspython>=2.8.0",
    # Database
    "pymongo>=4.17.0",
    "redis[hiredis]>=8.1.0",
    # Telegram
    "kurigram>=2.2.25",
    "tgcrypto>=1.2.5; platform_system == 'Linux'",
    # Serialization / Validation
    "pydantic>=2.13.5",
    # Utilities
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    # Performance
    "uvloop>=0.22.1; platform_system != 'Windows'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",   # Pyflakes: unused imports/vars, redefinitions
    "E4",  # pycodestyle subset: imports, blank lines
    "I",   # isort: import ordering
]
ignore = [
    "E402",  # module-level import not at top (late imports are deliberate failsafes)
    "E741",  # ambiguous variable names like `l` (kept for short loops)
]
