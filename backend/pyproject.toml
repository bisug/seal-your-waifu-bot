[project]
name = "app"
version = "0.1.0"
description = "Telegram Bot"
readme = "README.md"

# 3.14 is currently the safest modern production target.
requires-python = ">=3.14"

dependencies = [
    # API Framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    # HTTP / Networking
    "httpx>=0.28.1",
    "httptools>=0.8.0",
    "dnspython>=2.8.0",
    # Database
    "pymongo>=4.17.0",
    "redis[hiredis]>=8.1.0",
    # Telegram
    "kurigram>=2.2.24",
    "tgcrypto>=1.2.5; platform_system == 'Linux'",
    # Serialization / Validation
    "orjson>=3.12.0",
    "pydantic>=2.13.4",
    # Utilities
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    # Browser Automation
    "playwright>=1.62.0",
    # Performance
    "uvloop>=0.22.1; platform_system != 'Windows'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
