<div class="meta-banner bg-gallery">
    <div class="banner-overlay">
        <h3 class="banner-title">ARCHIVE</h3>
        <p class="banner-subtitle">Explore the global collection of all seals</p>
    </div>
</div>

<div class="quest-section">
    <div class="filter-bar-luxury">
        <div class="search-wrapper">
            <div class="search-icon-inside">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <input type="text" id="gallery-search" placeholder="Find characters...">
        </div>
        <div class="filter-select-wrapper">
            <select id="gallery-filter-rarity">
                <option value="">Rarity (All)</option>
            </select>
        </div>
    </div>
    <div id="gallery-scroll-container">
        <div id="gallery-grid" class="char-grid">
            <!-- Gallery cards here -->
        </div>
        <div id="gallery-loading" style="text-align:center; padding:10px; display:none;">
            <div class="spinner-mini"></div>
        </div>
    </div>
</div>
