<div class="meta-banner bg-shop">
    <div class="banner-overlay">
        <h3 class="banner-title">MARKETPLACE</h3>
        <p class="banner-subtitle">Spend your Shards and Zenith on premium items</p>
    </div>
</div>

<!-- Shop Balances -->
<div class="shop-balance-strip">
    <div class="shop-balance-item">
        <span class="shop-balance-label">SHARDS</span>
        <span id="shop-shards-val" class="shop-balance-val">0</span>⬪
    </div>
    <div class="shop-balance-item">
        <span class="shop-balance-label">ZENITH</span>
        <span id="shop-zenith-val" class="shop-balance-val">0</span>⧫
    </div>
</div>

<!-- Shop Sub-tabs -->
<div class="shop-subtabs">
    <div class="shop-subtab active" onclick="switchShopTab('chars')">CHARACTERS</div>
    <div class="shop-subtab" onclick="switchShopTab('pets')">PETS</div>
    <div class="shop-subtab" onclick="switchShopTab('upgrades')">PASS</div>
</div>

<!-- Shop Content Areas -->
<div id="shop-content-chars" class="shop-view active">
    <div class="section-header">
        <span class="header-line"></span>
        <h4 id="shop-rarity-title">DAILY STOCK (LEGENDARY)</h4>
        <span class="header-line"></span>
    </div>
    <div id="shop-chars-grid" class="char-grid">
        <!-- Shop characters populated by JS -->
    </div>
</div>

<div id="shop-content-pets" class="shop-view">
    <div class="section-header">
        <span class="header-line"></span>
        <h4>AVAILABLE PETS</h4>
        <span class="header-line"></span>
    </div>
    <div id="shop-pets-list">
        <!-- Pets populated by JS -->
    </div>
</div>

<div id="shop-content-upgrades" class="shop-view">
    <div class="section-header">
        <span class="header-line"></span>
        <h4>BATTLE PASS UPGRADES</h4>
        <span class="header-line"></span>
    </div>
    <div id="shop-pass-container">
        <!-- Pass info populated by JS -->
    </div>
</div>
